<!DOCTYPE html>
<!-- FORGE build mk38 / 2026-07-27 -->
<!-- FORGE — splash / threshold. Strike ENTER to ignite the forge and cross into the floor. -->
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1"/>
<title>FORGE — strike to ignite</title><!-- hero flame burns off at the strike point, revealing the P(θ|D) card -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
  :root{
    --void:#040207; --void2:#0a0610;
    --cyan:#2DD4FF; --cyan-hot:#7ff0ff; --cyan-dim:#0e6b73;
    --ember:#FF4D1F; --flame:#FF7A0D; --gold:#FFC857; --ignite:#FFB800;
    --amber:#f0a92e; --muted:#3f6b66;
    --mono:'Share Tech Mono', ui-monospace, Consolas, monospace;
    --disp:'Orbitron', var(--mono);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;background:var(--void);overflow:hidden;font-family:var(--mono);color:var(--cyan);cursor:pointer}
  #fx{position:fixed;inset:0;display:block;touch-action:none}
  #fx2{position:fixed;inset:0;z-index:6;pointer-events:none}  /* posterior layer, in front of the logo */

  /* logo: black background keyed out by screen blend, so the live flame shows through */
  #logo{position:fixed;left:50%;top:44%;transform:translate(-50%,-50%);
    width:min(500px,60vw);height:auto;mix-blend-mode:screen;pointer-events:none;z-index:5;
    filter:drop-shadow(0 0 22px rgba(45,212,255,.40)) drop-shadow(0 0 30px rgba(255,77,31,.34));
    transition:filter .25s, transform .25s, opacity .5s;}

  /* HUD */
  .hud{position:fixed;pointer-events:none;user-select:none;text-transform:uppercase;letter-spacing:.2em;z-index:6}

  /* phase rail (centred, under the plate) — a light progress stepper for the pipeline */
  #rail{position:fixed;bottom:74px;left:50%;z-index:8;pointer-events:none;width:min(640px,92vw);
    opacity:0;transform:translateX(-50%) translateY(8px);transition:opacity .45s ease, transform .45s ease;
    font-family:var(--mono)}
  #rail.on{opacity:1;transform:translateX(-50%) translateY(0)}
  #rail .rtrack{position:relative;height:5px;border-radius:3px;background:rgba(45,212,255,.30);margin:0 12px;box-shadow:0 0 10px rgba(45,212,255,.18)}
  #rail .rfill{position:absolute;left:0;top:0;height:100%;width:0;
    background:linear-gradient(90deg,var(--cyan),var(--gold));
    box-shadow:0 0 8px rgba(127,240,255,.55);transition:width .28s linear}
  #rail .rnode{position:absolute;top:50%;width:15px;height:15px;border-radius:50%;
    transform:translate(-50%,-50%);background:#0a1016;border:2px solid rgba(45,212,255,.5);
    transition:background .3s, border-color .3s, box-shadow .3s}
  #rail .rnode .rl{position:absolute;top:16px;left:50%;transform:translateX(-50%);
    font-size:11px;letter-spacing:.12em;white-space:nowrap;color:#3fa8b4;transition:color .3s}
  #rail .rnode.done{background:var(--cyan);border-color:var(--cyan);box-shadow:0 0 12px rgba(45,212,255,.85)}
  #rail .rnode.done .rl{color:#9fdcea}
  #rail .rnode.active{background:var(--gold);border-color:var(--gold);box-shadow:0 0 16px rgba(255,200,87,1)}
  #rail .rnode.active .rl{color:var(--gold)}
  #rail .rnode.active::after{content:"";position:absolute;inset:-5px;border-radius:50%;
    border:1px solid rgba(255,200,87,.6);animation:rpulse 1.1s ease-out infinite}
  @keyframes rpulse{0%{transform:scale(.6);opacity:.9}100%{transform:scale(1.8);opacity:0}}

  /* instruction / strike */
  #strike{position:fixed;bottom:clamp(150px,19vh,250px);left:0;right:0;text-align:center;z-index:6;pointer-events:none}
  #strike .key{display:inline-flex;align-items:center;gap:20px;font-family:var(--disp);font-weight:700;
    font-size:21px;letter-spacing:.30em;color:#eafbff;pointer-events:auto;cursor:pointer;
    padding:21px 46px;border:2px solid rgba(45,212,255,.45);border-radius:0;
    background:linear-gradient(180deg,rgba(45,212,255,.10),rgba(45,212,255,.02));
    animation:breathe 2.4s ease-in-out infinite;text-shadow:0 0 14px rgba(45,212,255,.55);
    transition:transform .22s ease, filter .22s ease, background .22s ease, border-color .22s ease, color .22s, text-shadow .22s}
  #strike .key:hover{animation:none;color:#fff;
    border-color:rgba(255,96,32,.95);
    background:linear-gradient(180deg, rgba(150,16,8,.55) 0%, rgba(255,122,32,.88) 100%);
    transform:scale(1.07);text-shadow:0 0 30px rgba(255,96,30,.9);
    filter:saturate(2.4) brightness(1.5)
      drop-shadow(0 0 44px rgba(255,58,18,.70)) drop-shadow(0 0 16px rgba(255,180,60,.6))}
  #strike .key:hover .hmr{color:#ffd27a;transform:rotate(-24deg)}
  #strike .hmr{width:30px;height:30px;flex:0 0 auto;color:var(--cyan);
    transform-origin:64% 78%;transition:color .22s, transform .28s cubic-bezier(.34,1.56,.64,1)}
  #strike .glyph{font-size:22px;color:var(--cyan)}
  @keyframes breathe{0%,100%{opacity:.62;border-color:rgba(45,212,255,.32)}
    50%{opacity:1;border-color:rgba(45,212,255,.72);box-shadow:0 0 24px rgba(45,212,255,.20)}}

  /* overlays */
  #grain{position:fixed;inset:0;pointer-events:none;z-index:7;mix-blend-mode:screen;opacity:.5;
    background:
      radial-gradient(130% 100% at 50% 44%, transparent 52%, rgba(2,1,6,.9) 100%),
      repeating-linear-gradient(0deg, rgba(45,212,255,.02) 0 1px, transparent 1px 3px);}
  #flash{position:fixed;inset:0;pointer-events:none;z-index:20;background:#fff;opacity:0;
    transition:opacity .75s ease-out}

  /* standalone landing stub (only when ENTER_TARGET is empty) */
  #floor{position:fixed;inset:0;z-index:30;display:none;flex-direction:column;align-items:center;justify-content:center;
    background:#fff;color:#0F1F3D;font-family:Georgia,serif;text-align:center;opacity:0;transition:opacity .6s .2s;gap:10px}
  #floor.show{display:flex;opacity:1}
  #floor .eye{font-family:var(--mono);font-size:11px;letter-spacing:.3em;text-transform:uppercase;color:#C67D3E}
  #floor h1{font-size:30px;font-weight:400;letter-spacing:.02em;margin:0}
  #floor p{color:#5C657A;font-family:system-ui,sans-serif;max-width:440px}
  #floor button{margin-top:14px;font:inherit;font-family:var(--mono);font-size:12px;letter-spacing:.18em;
    text-transform:uppercase;padding:9px 20px;border:1px solid #D9DCE3;background:#fff;color:#0F1F3D;cursor:pointer;border-radius:4px}
  #floor button:hover{border-color:#FF7A0D;color:#b5560a}

  @media (max-width:640px){
    #strike{bottom:15vh} #strike .key{font-size:16px;padding:16px 30px;gap:14px}
    #strike .hmr{width:23px;height:23px}
  }
  @media (prefers-reduced-motion:reduce){ #strike .key{animation:none} }
</style>
</head>

    sg.drawImage(heroImg,0,0,sw,S);
    const BW=480, BH=Math.round(BW/heroAsp);                  // …then up, smoothed = soft bloom
    const c=document.createElement("canvas"); c.width=BW; c.height=BH;
    const g=c.getContext("2d"); g.imageSmoothingEnabled=true; g.imageSmoothingQuality="high";
    try{ g.filter="blur(9px)"; }catch(_){}
    g.drawImage(sm,0,0,BW,BH);
    bloomCv=c;
  }
  heroImg.onload = ()=>{ heroReady=true; heroAsp=heroImg.width/heroImg.height; buildBloom(); resize(); };
  logo.style.opacity="0";                                    // the card waits under the veneer
  heroImg.src = "assets/images/forge_flame_hero.png";
  let strikePt = null;                                       // click point = ignition seed
  let voidCol = "#05030B";
  let W=0,H=0,DPR=1, cx=0, cy=0, fcx=0, flameW=0, flameH=0, reticleR=0,
      lock=null, burnFronts=null, skRect=null, heroBox=null, strikeHover=0, flameHover=0;
  function resize(){
    DPR = Math.min(1.5, devicePixelRatio||1);
    W = innerWidth; H = innerHeight;
    cv.width = W*DPR; cv.height = H*DPR;
    cv.style.width=W+"px"; cv.style.height=H+"px";
    ctx.setTransform(DPR,0,0,DPR,0,0);
    cv2.width = W*DPR; cv2.height = H*DPR;
    cv2.style.width=W+"px"; cv2.style.height=H+"px";
    ctx2.setTransform(DPR,0,0,DPR,0,0);
    cx = W/2; cy = H*0.44;
    voidCol = getComputedStyle(document.body).backgroundColor || voidCol;
    layoutLockup();
    seedAmbient();
    buildBurn();
    skRect = null;                                          // recomputed lazily in the loop
  }

  // ── LOCKUP layout: the flame is the hero and it is BIG; the wordmark rides
  //    beside it. Everything downstream (burn box, reticle, plume) is derived. ──
  const LK_WORD="F\u00B7O\u00B7R\u00B7G\u00B7E", LK_SUB="POSTERIOR OBSERVATORY";
  function layoutLockup(){
    const g=ctx2;
    const measure=(ws,ss)=>{
      g.save();
      g.font="800 "+ws+"px Orbitron, 'Share Tech Mono', monospace";
      try{ g.letterSpacing=(ws*0.30)+"px"; }catch(_){}
      const wwd=g.measureText(LK_WORD).width;
      g.font="600 "+ss+"px 'Share Tech Mono', monospace";
      try{ g.letterSpacing=(ss*0.52)+"px"; }catch(_){}
      const swd=g.measureText(LK_SUB).width;
      try{ g.letterSpacing="0px"; }catch(_){}
      g.restore();
      return {wwd,swd};
    };
    // Two candidate layouts; take whichever yields the BIGGER flame. Wide screens
    // land side-by-side, narrow/portrait ones stack the wordmark underneath.
    const stackedFh = ()=>{
      let w0=Math.min(W*0.088,46), s0=w0*0.40, mm=measure(w0,s0);
      if(mm.wwd>W*0.90){ const k=(W*0.90)/mm.wwd; w0*=k; s0*=k; mm=measure(w0,s0); }
      return Math.min(H*0.44, (W*0.66)/heroAsp, H*0.86 - w0*1.95 - w0*0.55);
    };
    const sideFh = ()=>{
      const LW=Math.min(W*0.86,1720);
      let f=Math.min(H*0.54, LW*0.46);
      const mm=measure(f*0.20, f*0.08);
      const tot=f*heroAsp + f*0.11 + Math.max(mm.wwd,mm.swd);
      return tot>LW ? f*(LW/tot) : f;
    };
    const STACK = stackedFh() > sideFh();
    let fh,fw,ws,ss,gap,m,boxW,boxH,fx,fy,tx,tmid;

    if(STACK){
      ws = Math.min(W*0.088, 46);                           // size the wordmark to the width first
      ss = ws*0.40;
      m  = measure(ws,ss);
      if(m.wwd > W*0.90){ const k=(W*0.90)/m.wwd; ws*=k; ss*=k; m=measure(ws,ss); }
      const textH = ws*1.95;
      gap = ws*0.55;
      fh  = Math.min(H*0.44, (W*0.66)/heroAsp, H*0.86-textH-gap);
      fw  = fh*heroAsp;
      boxW= Math.max(fw, m.wwd, m.swd);
      boxH= fh + gap + textH;
      lock={};
      fx  = cx - fw/2;             fy = cy - boxH/2;
      tx  = cx - m.wwd/2;          tmid = fy + fh + gap + ws*0.78;
    } else {
      const LWmax = Math.min(W*0.86, 1720);
      fh = Math.min(H*0.54, LWmax*0.46);                    // flame height — the dominant element
      fw = fh*heroAsp;  ws = fh*0.20;  ss = ws*0.40;  gap = fh*0.11;
      m  = measure(ws,ss);
      let total = fw+gap+Math.max(m.wwd,m.swd);
      if(total>LWmax){                                      // scale the whole lockup to fit
        const k=LWmax/total;
        fh*=k; fw*=k; ws*=k; ss*=k; gap*=k;
        m=measure(ws,ss); total=fw+gap+Math.max(m.wwd,m.swd);
      }
      boxW = fw+gap+Math.max(m.wwd,m.swd);
      boxH = Math.max(fh, ws*2.0);
      fx   = cx-boxW/2;            fy = cy-boxH/2 + (boxH-fh)/2;
      tx   = cx-boxW/2+fw+gap;     tmid = cy;
    }

    lock={ fh,fw,ws,ss,gap, wwd:m.wwd, swd:m.swd, stack:STACK,
           x:cx-boxW/2, y:cy-boxH/2, w:boxW, h:boxH, fx, fy, tx, tmid };
    const pad=Math.max(20, fh*0.07);
    heroBox={ x:lock.x-pad, y:lock.y-pad, w:lock.w+2*pad, h:lock.h+2*pad };
    fcx     = fx + fw/2;                                    // the fire rises under the FLAME
    flameW  = fw*1.32;
    flameH  = fh;
    reticleR= Math.max(lock.w*0.52, Math.min(W,H)*0.44);    // big reticle, framing the lockup
  }
  // NOTE: the first resize() runs at the BOTTOM of this script — it touches the
  // ambient-ember pool, which is declared further down (temporal dead zone).
  addEventListener("resize", resize);
  logo.addEventListener("load", resize);                    // re-anchor once the plate decodes
  if(document.fonts && document.fonts.ready) document.fonts.ready.then(resize);   // re-measure once Orbitron lands

  // ── fire: soft rising particle plume (no bars) ──────────────────────────
  function gauss(){ // ~N(0,1), Box-Muller (cheap)
    let u=0,v=0; while(!u)u=Math.random(); while(!v)v=Math.random();
    return Math.sqrt(-2*Math.log(u))*Math.cos(6.283185*v);
  }
  // ── pre-baked particle sprites: blit instead of allocating a gradient per
  //    particle per frame (the old hot path). Bucket each particle to the
  //    nearest palette hue; under additive blending the banding is invisible. ──
  const FIRE_PAL = [
    [255,255,235], // white-hot tip
    [255,200,87],  // gold
    [255,122,13],  // flame
    [255,77,31],   // ember
    [127,240,255], // cyan-hot (cool-left)
    [45,212,255],  // cyan
  ];
  const SPR = 64;
  const fireSprites = FIRE_PAL.map(col=>{
    const c=document.createElement("canvas"); c.width=c.height=SPR;
    const g=c.getContext("2d");
    const rg=g.createRadialGradient(SPR/2,SPR/2,0,SPR/2,SPR/2,SPR/2);
    rg.addColorStop(0, rgba(col,1)); rg.addColorStop(1, rgba(col,0));
    g.fillStyle=rg; g.fillRect(0,0,SPR,SPR);
    return c;
  });
  function nearestSprite(col){
    let bi=0,bd=1e9;
    for(let i=0;i<FIRE_PAL.length;i++){
      const p=FIRE_PAL[i], dr=col[0]-p[0], dg=col[1]-p[1], db=col[2]-p[2];
      const d=dr*dr+dg*dg+db*db; if(d<bd){bd=d;bi=i;}
    }
    return fireSprites[bi];
  }

  const FIRE_CAP = 240, EMBER_CAP = 140;     // bound worst-case particle counts
  const fire = [];
  // heat ∈ [0,1]: 0 = cold, ~0.08 = idle smolder, 1 = struck. Drives the whole fire.
  function spawnFire(heat){
    if(fire.length>=FIRE_CAP) return;
    const spread = flameW * (0.06 + 0.12*heat) * (0.6 + Math.random()*0.6);
    const ox = gauss()*spread*(0.45 + 0.55*heat);
    const u = Math.max(-1,Math.min(1, ox/(flameW*0.5)));    // -1..1 for cyan→ember tint
    const side = (u+1)/2;
    const baseY = (lock ? lock.fy+lock.fh : cy+flameH*0.5) - flameH*0.04;
    fire.push({
      x: fcx + ox, y: baseY + Math.random()*6,
      vx: ox*0.004 + gauss()*0.10*(0.4+0.6*heat),
      vy: -(0.28 + Math.random()*(0.4 + 1.9*heat)),         // slow & low when smolder
      wob: Math.random()*6.283, wobS: 0.5+Math.random()*1.3,
      drift: (0.12 + 0.55*heat) + Math.random()*0.4,
      r: (3 + Math.random()*4) + heat*(7 + Math.random()*13), // small smolder → big fire
      side, life: 1, decay: (0.030 - 0.015*heat) + Math.random()*0.012, // short life when cold
    });
  }

  // ── (5) ambient ember fall, inverted: a constant background burn where the
  //    motes drift UP forever, like snow run backwards. Never gated on state. ──
  const AMB=[];
  const ambTarget = ()=> Math.round(Math.min(190, Math.max(40, (W*H)/11000)));
  function newAmb(seeded){
    return { x: Math.random()*W,
             y: seeded ? Math.random()*H : H+10+Math.random()*60,
             vy: -(0.10+Math.random()*0.40),
             r: 0.8+Math.random()*2.2,
             wob: Math.random()*6.283, wobS: 0.16+Math.random()*0.55, drift: 0.10+Math.random()*0.55,
             tw: Math.random()*6.283, twS: 0.9+Math.random()*2.4,
             a: 0.16+Math.random()*0.46,
             c: mix(C.ember, C.gold, Math.random()) };
  }
  function seedAmbient(){ AMB.length=0; const n=ambTarget(); for(let i=0;i<n;i++) AMB.push(newAmb(true)); }
  function drawAmbient(t, heat){
    const want=ambTarget();
    while(AMB.length<want) AMB.push(newAmb(false));
    while(AMB.length>want) AMB.pop();
    ctx.save(); ctx.globalCompositeOperation="lighter";
    for(const p of AMB){
      p.y += p.vy*(1+0.60*heat);
      p.x += Math.sin(t*p.wobS+p.wob)*p.drift;
      if(p.y<-14 || p.x<-40 || p.x>W+40){ Object.assign(p, newAmb(false)); continue; }
      const tw=0.55+0.45*Math.sin(t*p.twS+p.tw);
      const rr=p.r*(0.85+0.30*tw)*2.2;
      ctx.globalAlpha=Math.min(1, p.a*tw*(0.60+0.40*heat));
      ctx.drawImage(nearestSprite(p.c), p.x-rr, p.y-rr, rr*2, rr*2);
    }
    ctx.globalAlpha=1; ctx.restore();
  }

  // ── click sparks: hot, fast, gravity-fed streaks thrown off the strike ─────
  const SPARK_CAP=560, sparks=[];
  function burstSparks(x,y,n,pow){
    for(let i=0;i<n && sparks.length<SPARK_CAP;i++){
      const a=Math.random()*6.283, sp=(0.8+Math.random()*5.4)*pow;
      sparks.push({ x, y, px:x, py:y,
        vx:Math.cos(a)*sp, vy:Math.sin(a)*sp-1.2,
        life:1, decay:0.009+Math.random()*0.022, w:0.8+Math.random()*1.6,
        c: mix(mix(C.gold,[255,255,235],Math.random()*0.75), C.flame, Math.random()*0.45) });
    }
  }
  function drawSparks(){
    if(!sparks.length) return;
    ctx.save(); ctx.globalCompositeOperation="lighter"; ctx.lineCap="round";
    for(let i=sparks.length-1;i>=0;i--){
      const p=sparks[i];
      p.life-=p.decay; if(p.life<=0){ sparks.splice(i,1); continue; }
      p.px=p.x; p.py=p.y;
      p.vx*=0.962; p.vy=p.vy*0.962+0.085;                   // drag + gravity
      p.x+=p.vx; p.y+=p.vy;
      const a=Math.pow(p.life,1.25);
      ctx.strokeStyle=rgba(p.c,a*0.95); ctx.lineWidth=p.w*(0.35+0.65*p.life);
      ctx.beginPath(); ctx.moveTo(p.px,p.py); ctx.lineTo(p.x,p.y); ctx.stroke();
    }
    ctx.restore();
  }

  // ── embers: sparse, longer-lived motes riding the burn fronts ───────────
  const embers = [];
  function spawnEmber(burst){
    if(embers.length>=EMBER_CAP) return;
    const u = gauss()*0.5;
    embers.push({
      x: fcx + u*flameW*0.42,
      y: (lock ? lock.fy+lock.fh*0.86 : cy+flameH*0.40),
      vx: u*0.25 + (Math.random()-0.5)*0.5,
      vy: -(0.7 + Math.random()*1.6) * (burst?2.4:1),
      life: 1, r: 1+Math.random()*2.0,
      c: mix(C.flame, C.gold, Math.random()),
    });
  }


  // ── paper-burn fronts: irregular edges, confined to the lockup plate ──
  function buildBurn(){
    if(!flameW || !heroBox) return;
    const b=heroBox, bcx=b.x+b.w/2, bcy=b.y+b.h/2, bdiag=Math.hypot(b.w,b.h);
    const spots=[];
    const N = 24;
    for(let i=0;i<N;i++){
      // spread across the plate; growth is clamped to the plate border at draw time
      const x = bcx + (Math.random()-0.5)*b.w*0.84;
      const y = bcy + (Math.random()-0.5)*b.h*0.84;
      const harm=[]; for(let k=1;k<=6;k++) harm.push({k, a:(0.44/k)*(0.55+Math.random()), p:Math.random()*6.283});
      const ch=[];   for(let k=1;k<=4;k++) ch.push({k, a:1/k, p:Math.random()*6.283});
      spots.push({
        x, y, dist: Math.hypot(x-bcx, y-bcy),
        r0: 2 + Math.random()*8,
        rMax: bdiag*(0.55 + Math.random()*0.30),                  // generous; the border clamp stops it
        bright: 0.5 + Math.random()*0.7,
        harm, ch, bias:Math.random()*6.283, biasA:0.22+Math.random()*0.20,
      });
    }
    // ignite from the STRIKE POINT outward — start time grows with distance from it
    const sp = strikePt || {x:bcx, y:bcy};
    for(const s of spots) s.dist = Math.hypot(s.x-sp.x, s.y-sp.y);
    const maxD = Math.max(...spots.map(s=>s.dist)) || 1;
    for(const s of spots) s.start = (s.dist/maxD)*0.55 + Math.random()*0.05;
    burnFronts = spots;
  }
  function frontRadius(f, ang){
    let n=0; for(const h of f.harm) n+=h.a*Math.sin(h.k*ang+h.p);
    n += f.biasA*Math.cos(ang - f.bias);          // push one side out (asymmetric)
    return Math.max(0.30, 1+n);
  }
  function frontHeat(f, ang){                      // 0..1 → color density along the edge
    let n=0; for(const h of f.ch) n+=h.a*Math.sin(h.k*ang+h.p);
    return 0.5+0.5*Math.tanh(n);
  }

  // ── the veneer: the brand LOCKUP (flame + F·O·R·G·E + sub) — the burn eats THIS,
  //    revealing the P(theta|D) card beneath. ──
  function drawLockup(g, jx, jy, aMul, glow, surge){
    if(!lock) return;
    const L=lock;
    const fx=L.fx+jx, fy=L.fy+jy;

    // A ── bloom: one pre-blurred layer, same geometry, additive. No ghost.
    if(bloomCv){
      const sp=L.fh*0.15;                                   // the glow spills past the art
      g.save(); g.globalCompositeOperation="lighter";
      g.globalAlpha=Math.min(1, aMul*(0.20+0.48*glow+0.34*surge));
      g.drawImage(bloomCv, fx-sp*heroAsp, fy-sp, L.fw+2*sp*heroAsp, L.fh+2*sp);
      g.restore();
    }
    // B ── the flame: exactly ONE crisp draw
    if(heroReady){
      g.save(); g.imageSmoothingEnabled=true; g.imageSmoothingQuality="high";
      g.globalAlpha=aMul;
      g.drawImage(heroImg, fx, fy, L.fw, L.fh);
      g.restore();
    }
    // C ── wordmark
    const tx=L.tx+jx, tcy=L.tmid+jy;
    g.save();
    g.textBaseline="alphabetic"; g.textAlign="left";
    g.font="800 "+L.ws+"px Orbitron, 'Share Tech Mono', monospace";
    try{ g.letterSpacing=(L.ws*0.30)+"px"; }catch(_){}
    g.globalCompositeOperation="lighter"; g.globalAlpha=Math.min(1, aMul*(0.30+0.40*glow+0.30*surge));
    g.fillStyle="rgba(255,178,74,0.85)"; g.fillText(LK_WORD, tx, tcy-L.ws*0.18);
    g.globalCompositeOperation="source-over"; g.globalAlpha=aMul;
    g.fillStyle="#ffe9c8"; g.fillText(LK_WORD, tx, tcy-L.ws*0.18);
    g.font="600 "+L.ss+"px 'Share Tech Mono', monospace";
    try{ g.letterSpacing=(L.ss*0.52)+"px"; }catch(_){}
    g.fillStyle="rgba(217,185,140,0.88)";
    g.fillText(LK_SUB, tx, tcy+L.ws*0.52);
    const grd=g.createLinearGradient(tx,0,tx+L.wwd,0);
    grd.addColorStop(0,"rgba(255,178,74,0.9)"); grd.addColorStop(1,"rgba(255,178,74,0)");
    g.fillStyle=grd; g.fillRect(tx, tcy+L.ws*0.82, L.wwd, Math.max(1.6,L.ws*0.045));

    // the FUSE: the rule catches off the flame and runs left → right.
    // aMul gate keeps it single-strength — drawLockup also runs an additive pass.
    if(fuseAmt>0 && aMul>=0.99){
      const ry=tcy+L.ws*0.82, rh=Math.max(1.6,L.ws*0.045), hx=tx+L.wwd*fuseAmt;
      g.save(); g.globalCompositeOperation="lighter";
      const tg=g.createLinearGradient(tx,0,hx,0);              // burnt trail behind the head
      tg.addColorStop(0.00,"rgba(255,105,15,0.40)");
      tg.addColorStop(0.65,"rgba(255,165,60,0.80)");
      tg.addColorStop(1.00,"rgba(255,255,240,1)");
      g.fillStyle=tg; g.fillRect(tx, ry-rh*1.1, hx-tx, rh*3.2);
      if(fuseAmt<1){                                            // the hot head
        const R=rh*10, hg=g.createRadialGradient(hx, ry+rh*0.5, 0, hx, ry+rh*0.5, R);
        hg.addColorStop(0.00,"rgba(255,255,246,0.95)");
        hg.addColorStop(0.30,"rgba(255,190,90,0.55)");
        hg.addColorStop(1.00,"rgba(255,110,18,0)");
        g.fillStyle=hg; g.beginPath(); g.arc(hx, ry+rh*0.5, R, 0, 6.2832); g.fill();
      }
      g.restore();
    }
    try{ g.letterSpacing="0px"; }catch(_){}
    g.restore();
    g.globalAlpha=1;
  }
  function drawVeneer(t, surge, glow, zap, breath, flare){
    if(!heroBox || !lock) return;
    const b=heroBox, g=ctx2;
    g.save();
    // The plate exists only so the BURN has something opaque to erode off the
    // card. At rest it punches a visible rectangle through the reticle and the
    // ember field — so draw it only once the burn is actually running.
    if(IGNITE_MODE!=="flare" && state!=="idle"){
      g.fillStyle=voidCol;
      g.fillRect(b.x-2, b.y-2, b.w+4, b.h+4);
    }
    const bs=1+0.008*breath+0.02*surge;                      // gentle breathing
    g.translate(b.x+b.w/2, b.y+b.h/2); g.scale(bs,bs); g.translate(-(b.x+b.w/2), -(b.y+b.h/2));
    drawLockup(g, 0, 0, 1, glow, surge);
    if(flare>0){                        // FLARE: catch (0-.35), HOLD (.35-.82), blow out
      const fA=smooth(Math.min(1, flare/0.35));            // rises, then sits steady
      g.globalCompositeOperation="lighter";
      drawLockup(g, 0, 0, Math.min(1, fA*0.95), 1.4, 1);
      g.globalCompositeOperation="source-over";
    }
    if(zap>0){                                               // ZAP: jittered electric copies + white wash
      g.globalCompositeOperation="lighter";
      for(let k=0;k<2;k++)
        drawLockup(g, (Math.random()-0.5)*14*zap, (Math.random()-0.5)*14*zap, zap*0.28, glow, surge);
      g.globalCompositeOperation="source-over";
      g.globalAlpha=zap*0.5; g.fillStyle="#fff";
      g.fillRect(b.x-2, b.y-2, b.w+4, b.h+4); g.globalAlpha=1;
    }
    g.restore();
  }
  // ── reticle + rings (HELIX console echo) ────────────────────────────────
  function drawFrame(t, glow){
    ctx.save(); ctx.globalCompositeOperation="lighter";
    const R = reticleR;
    for(let k=0;k<2;k++){
      const r = R*(1+k*0.34) + Math.sin(t*0.6+k)*2;
      ctx.beginPath(); ctx.arc(cx,cy,r,0,Math.PI*2);
      ctx.strokeStyle=rgba(C.cyan,(0.10-k*0.03)+glow*0.10); ctx.lineWidth=1; ctx.stroke();
      // tick marks
      const ticks=48;
      for(let i=0;i<ticks;i++){
        if(i%4) continue;
        const a=i/ticks*Math.PI*2, c=Math.cos(a),s=Math.sin(a);
        ctx.beginPath(); ctx.moveTo(cx+c*r,cy+s*r); ctx.lineTo(cx+c*(r+5),cy+s*(r+5));
        ctx.strokeStyle=rgba(C.cyanDim||[14,107,115],.4); ctx.stroke();
      }
    }
    // crosshair
    const ch=R*1.5;
    ctx.strokeStyle=rgba(C.cyan,.07+glow*.08); ctx.lineWidth=1;
    ctx.beginPath();
    ctx.moveTo(cx-ch,cy);ctx.lineTo(cx-R*0.55,cy);ctx.moveTo(cx+R*0.55,cy);ctx.lineTo(cx+ch,cy);
    ctx.moveTo(cx,cy-ch*0.9);ctx.lineTo(cx,cy-R*0.6);ctx.moveTo(cx,cy+R*0.6);ctx.lineTo(cx,cy+ch*0.9);
    ctx.stroke(); ctx.restore();
  }

  // ── state machine ───────────────────────────────────────────────────────
  let state="idle", t0=performance.now(), igniteAt=0, heat=0;
  let fuseAt=0, fuseAmt=0, wipeAt=0, wipeAmt=0;
  let hover=0, mx=-99999, my=-99999;                       // proximity "charge" before ignition
  const flash = document.getElementById("flash");
  const strikeEl = document.getElementById("strike");
  const keyEl = document.querySelector("#strike .key");
  const grainEl = document.getElementById("grain");
  let keyWasHot = false, lastStrike = -1e9;   // a hammer strikes once per hover, not continuously
  // The STRIKE FACE — the flat square end on the left, in the hammer's own
  // viewBox units. Looked up fresh each call: restoring the button label
  // replaces the <svg>, and a cached node would go stale and stop sparking.
  // getScreenCTM carries the live CSS rotation, so this tracks the swing.
  function hammerTip(){
    const el = keyEl && keyEl.querySelector(".hmr");
    if(!el || !el.getScreenCTM || typeof DOMPoint==="undefined") return null;
    try{
      const m=el.getScreenCTM(); if(!m) return null;
      const p=new DOMPoint(3.0, 6.1).matrixTransform(m);
      return (isFinite(p.x)&&isFinite(p.y)) ? {x:p.x, y:p.y} : null;
    }catch(_){ return null; }
  }
  function hammerSparks(x, y, n, pow){
    for(let i=0;i<n && sparks.length<SPARK_CAP;i++){
      const flier=Math.random()<0.20;                       // a few long, fast ones carry the eye
      const a=Math.random()*6.283, sp=(0.6+Math.random()*3.4)*pow*(flier?2.2:1);
      sparks.push({ x:x+(Math.random()-0.5)*6, y:y+(Math.random()-0.5)*6, px:x, py:y,
        vx:Math.cos(a)*sp, vy:Math.sin(a)*sp-(0.5+Math.random()*2.0),
        life:1,
        decay:(flier?0.007:0.016)+Math.random()*(flier?0.011:0.030),
        w:(flier?1.1:0.7)+Math.random()*1.4,
        c: mix(mix(C.gold,[255,255,235],Math.random()*0.85), C.flame, Math.random()*0.35) });
    }
  }

  // ── phase rail: a light progress stepper, lit as each pipeline phase runs ──
  const railEl = document.getElementById("rail");
  const rtrack = document.getElementById("rtrack");
  const rfill  = document.getElementById("rfill");
  const PH = [   // at = seconds since ignite (phase begins) — pure burn progress
    { name:"STRIKE", at:0.02 },
    { name:"IGNITE", at:0.22 },
    { name:"BURN",   at:0.60 },
    { name:"ETCH",   at:1.45 },
    { name:"REVEAL", at:2.30 },
  ];
  const railNodes = PH.map((p,i)=>{
    const n=document.createElement("div"); n.className="rnode";
    n.style.left=(PH.length>1 ? i/(PH.length-1)*100 : 0)+"%";
    const l=document.createElement("div"); l.className="rl"; l.textContent=p.name;
    n.appendChild(l); if(rtrack) rtrack.appendChild(n); return n;
  });
  let railShown=false;
  function updateRail(e){
    if(!railEl) return;
    if(!railShown && e>0){ railEl.classList.add("on"); railShown=true; }
    let k=0; for(let i=0;i<PH.length;i++){ if(e>=PH[i].at) k=i; }
    const a=PH[k].at, b=(k<PH.length-1)?PH[k+1].at:a+1;
    const within=(k<PH.length-1)?Math.min(1,Math.max(0,(e-a)/(b-a))):0;  // last node = terminus, no overshoot
    rfill.style.width=((k+within)/(PH.length-1)*100)+"%";
    for(let i=0;i<railNodes.length;i++){
      railNodes[i].classList.toggle("done", i<k);
      railNodes[i].classList.toggle("active", i===k);
    }
  }

  // ── ignition mode ───────────────────────────────────────────────────────
  //  "flare" — one press: sparks, the flame CATCHES, white-out, straight to the
  //            floor. No card, no burn-through. Fast (~1.4s).
  //  "burn"  — the old sequence: zap, the lockup burns away over 2s and reveals
  //            the P(theta|D) card underneath, then crosses.
  const IGNITE_MODE = "flare";
  const FLARE_S     = 1.70;  // phase A — the flame catches and holds
  const FUSE_S      = 0.45;  // phase B — the underline burns left → right
  const WIPE_S      = 0.40;  // phase C — the fire sweeps the splash away
  const AUTO_CROSS  = true;  // burn: cross automatically instead of asking for a 2nd press
  const HOLD_MS     = 1000;  // burn: how long the revealed card holds first
  function ignite(px,py){
    if(state!=="idle") return;
    if(px!==undefined && heroBox){                              // clamp the seed into the lockup
      const b=heroBox, inset=10;
      strikePt = { x: Math.max(b.x+inset, Math.min(b.x+b.w-inset, px)),
                   y: Math.max(b.y+inset, Math.min(b.y+b.h-inset, py)) };
    } else if(heroBox) strikePt = { x: heroBox.x+heroBox.w/2, y: heroBox.y+heroBox.h/2 };
    strikeEl.style.transition="opacity .3s"; strikeEl.style.opacity="0";
    igniteAt=performance.now();
    // ── audio: the strike IS the user gesture, so this always gets to play.
    //    The epoch stamp lets dash1 resume the same track at the right offset
    //    and lets the terminal schedule ENTER onto the beat drop.
    try{
      sessionStorage.setItem("forgeAudioT0", String(Date.now()));
      var A=new Audio("assets/audio/forge-boot.wav");
      A.volume=0.9; window.__forgeAudio=A; A.play().catch(function(){});
    }catch(_){}
    if(IGNITE_MODE==="flare"){                                  // simple: set the flame, then go
      state="flaring";
      if(reduce){ crossNow(); return; }
    } else {
      buildBurn();                                              // re-seed fronts from the strike point
      logo.style.opacity="1";                                   // the reveal target waits under the veneer
      if(reduce){ state="held"; holdReveal(); updateRail(9); return; }
      state="igniting";
      logo.style.transform="translate(-50%,-50%) scale(1.06)";
      logo.style.filter="drop-shadow(0 0 40px rgba(255,184,0,.7)) drop-shadow(0 0 60px rgba(255,77,31,.6))";
    }
    for(let i=0;i<60;i++) spawnEmber(true);
    for(let i=0;i<70;i++) spawnFire(1);
    burstSparks(strikePt.x, strikePt.y, 120, 1.5);              // sparks fly off the strike
    setTimeout(()=>burstSparks(strikePt.x, strikePt.y, 70, 1.0), 90);
    if(navigator.vibrate) navigator.vibrate(40);
  }
  function holdReveal(){                                        // burn done — the card holds
    if(AUTO_CROSS){ setTimeout(crossNow, HOLD_MS); return; }
    strikeEl.style.transition="opacity .5s"; strikeEl.style.opacity="1";
    if(keyEl) keyEl.innerHTML='<span class="glyph">&#9166;</span> ENTER THE OBSERVATORY';
  }
  function crossNow(){
    if(state==="done") return; state="done";
    flash.style.opacity="1";
    setTimeout(cross, 320);
  }
  // the sweep itself — a burning edge running right, dark behind it, so the
  // hand-off lands on the (dark) deck instead of flashing white
  function drawWipe(){
    if(wipeAmt<=0) return;
    const g=ctx2, x=W*wipeAmt, ew=Math.max(100, W*0.10);
    g.save();
    g.fillStyle=voidCol; g.fillRect(0, 0, Math.max(0,x-ew*0.20), H);
    const eg=g.createLinearGradient(x-ew, 0, x+ew*0.14, 0);
    eg.addColorStop(0.00,"rgba(255,90,10,0)");
    eg.addColorStop(0.42,"rgba(255,120,20,0.50)");
    eg.addColorStop(0.78,"rgba(255,190,90,0.92)");
    eg.addColorStop(0.95,"rgba(255,255,246,1)");
    eg.addColorStop(1.00,"rgba(255,255,246,0)");
    g.globalCompositeOperation="lighter";
    g.fillStyle=eg; g.fillRect(x-ew, 0, ew*1.14, H);
    g.restore();
  }
  function cross(){
    if(ENTER_TARGET){ location.href = ENTER_TARGET; return; }
    document.getElementById("floor").classList.add("show");
  }
  // Re-arm the splash. Also runs on bfcache restore: pressing Back from the
  // deck would otherwise land on a page frozen in state "done" — no hover
  // sparks, no ignite, nothing responding.
  const KEY_HTML = keyEl ? keyEl.innerHTML : "";
  function resetSplash(){
    state="idle"; strikePt=null; burnFronts=null; igniteAt=0; keyWasHot=false;
    fire.length=0; embers.length=0; sparks.length=0;
    heat=0; hover=0; flameHover=0; strikeHover=0; skRect=null; lastStrike=-1e9;
    fuseAt=0; fuseAmt=0; wipeAt=0; wipeAmt=0;
    if(grainEl) grainEl.style.opacity="";
    logo.style.opacity="0"; logo.style.mixBlendMode="screen";
    logo.style.filter=""; logo.style.transform="translate(-50%,-50%)";
    flash.style.transition="none"; flash.style.opacity="0";
    requestAnimationFrame(()=>{ flash.style.transition="opacity .75s ease-out"; });
    document.getElementById("floor").classList.remove("show");
    strikeEl.style.transition="opacity .3s"; strikeEl.style.opacity="1";
    if(keyEl) keyEl.innerHTML=KEY_HTML;
    if(railEl){ railEl.classList.remove("on"); railShown=false; rfill.style.width="0%";
      railNodes.forEach(n=>n.classList.remove("done","active")); }
    resize();
  }
  window.__forgeReset = resetSplash;
  document.getElementById("reignite").addEventListener("click", e=>{ e.stopPropagation(); resetSplash(); });
  addEventListener("pageshow", e=>{ if(e.persisted) resetSplash(); });

  addEventListener("keydown", e=>{
    if(e.key==="Enter"||e.key===" "){ e.preventDefault();
      if(state==="held") crossNow(); else ignite(); }
  });
  addEventListener("pointerdown", e=>{
    if(state==="held") crossNow(); else ignite(e.clientX, e.clientY); });
  ["pointermove","mousemove"].forEach(ev=>{
    const h=e=>{ if(e.pointerType!=="touch"){ mx=e.clientX; my=e.clientY; } };
    window.addEventListener(ev, h, {passive:true});
    document.addEventListener(ev, h, {passive:true});
  });
  document.addEventListener("mouseleave", ()=>{ mx=-99999; my=-99999; });

  // ── render loop ─────────────────────────────────────────────────────────
  function frame(now){
    const t=(now-t0)/1000;
    ctx.clearRect(0,0,W,H);

    // ignite progress (resolve → hold → overlay burns to the image edges → hold → cross)
    let surge=0, post=0, fin=0, edge=0, zap=0, flare=0, eIg=-1;
    // ── FLARE mode runs three phases: the flame catches, the underline burns
    //    left→right off it, then the fire wipes the screen. Everything is held
    //    at full through "done" so nothing blanks out before the hand-off.
    if(IGNITE_MODE==="flare" && state==="done"){ surge=1; flare=1; fuseAmt=1; wipeAmt=1; }
    if(state==="flaring"){                                   // A: the flame catches
      const e=(now-igniteAt)/1000;
      surge = Math.min(1, e/0.55);
      flare = Math.min(1, e/FLARE_S);
      if(Math.random()<0.85) spawnEmber(true);
      for(let i=0;i<3;i++) spawnFire(1);
      if(e>=FLARE_S){ state="fusing"; fuseAt=now; }
    }
    if(state==="fusing"){                                    // B: the fuse runs the underline
      surge=1; flare=1;
      fuseAmt = Math.min(1, (now-fuseAt)/1000/FUSE_S);
      for(let i=0;i<2;i++) spawnFire(1);
      if(lock && fuseAmt<1){                                 // sparks shed off the moving head
        const hx=lock.tx + lock.wwd*fuseAmt,
              hy=lock.tmid + lock.ws*0.82 + Math.max(1.6, lock.ws*0.045)*0.5;
        hammerSparks(hx, hy, 5, 0.85);
      }
      if(fuseAmt>=1){ state="wiping"; wipeAt=now; }
    }
    if(state==="wiping"){                                    // C: the sweep
      surge=1; flare=1; fuseAmt=1;
      wipeAmt = Math.min(1, (now-wipeAt)/1000/WIPE_S);
      if(Math.random()<0.9) hammerSparks(W*wipeAmt-6, Math.random()*H, 3, 1.0);
      if(wipeAmt>=1 && state!=="done"){ state="done"; cross(); }
    }
    if(state==="igniting"||state==="held"){
      const e = eIg = (now-igniteAt)/1000;
      surge = Math.min(1, e/0.6);                          // flame roars up fast
      zap   = Math.max(0, 1 - e/0.35);                     // electric strike flash, 0.35s
      post  = Math.min(1, Math.max(0,(e-0.15)/2.2));       // inference resolves alongside the burn
      fin   = Math.min(1, Math.max(0,(e-0.35)/2.0));       // THE BURN: 2.0s from zap end (his spec)
      edge  = Math.min(1, Math.max(0,(e-1.95)/0.4));       // plate edge catches as the burn lands
      if(state==="igniting" && fin>=1){ state="held"; holdReveal(); }   // reveal holds — second input enters
      if(state==="igniting" && Math.random()<0.9) spawnEmber(true);
      if(IGNITE_MODE!=="flare") updateRail(Math.min(e, 2.4));
    }
    const breath = reduce?0.5:(0.5+0.5*Math.sin(t*1.4));

    // proximity charge — the page wakes up as the pointer nears the mark
    let hoverTarget = 0;
    if(state==="idle"){
      const d=Math.hypot(mx-cx, my-cy), R0=Math.min(W,H)*0.62;
      hoverTarget = Math.max(0, Math.min(1, 1 - d/R0));
    }
    hover += (hoverTarget - hover) * 0.08;

    // FLAME hover — pointer over the flame itself makes it glow hard
    let fhTarget = 0;
    if(state==="idle" && lock){
      const L=lock, fmx=L.fx+L.fw/2, fmy=L.fy+L.fh/2;
      const ex=Math.abs(mx-fmx)/(L.fw*0.82), ey=Math.abs(my-fmy)/(L.fh*0.60);
      fhTarget = Math.max(0, 1-Math.max(ex,ey));
    }
    flameHover += (fhTarget - flameHover) * 0.14;
    const glow = Math.min(1.4, hover*0.35 + flameHover*1.15);   // what drives the lockup bloom

    // heat ramps from a low idle smolder up to full fire once struck (charge lifts the smolder)
    const heatTarget = (state==="idle") ? (0.08 + 0.26*hover + 0.46*flameHover) : 1;
    heat += (heatTarget - heat) * (state==="idle" ? 0.04 : 0.05);
    const dim = (1 - 0.5*post*(1-fin)) + 0.5*fin;            // flame recedes for the result, then surges back

    // logo charges up as you approach the mark (idle only)
    if(state==="idle"){
      logo.style.transform = `translate(-50%,-50%) scale(${(1+0.03*hover).toFixed(3)})`;
      logo.style.filter =
        `drop-shadow(0 0 ${(22+50*hover)|0}px rgba(45,212,255,${(0.40+0.45*hover).toFixed(2)})) `
       +`drop-shadow(0 0 ${(30+70*hover)|0}px rgba(255,77,31,${(0.34+0.50*hover).toFixed(2)}))`;
    }

    // STRIKE key: native :hover does the blue→magma morph and cocks the hammer
    // back; the tip throws sparks as it drops.
    const keyHot = (state==="idle" && keyEl && keyEl.matches(":hover"));
    strikeHover += ((keyHot?1:0) - strikeHover) * 0.15;
    // ONE strike per hover: the swing throws a shower, the landing throws a
    // second 115ms later, then it stops. No trickle — this is a hammer.
    // The cooldown keeps a cursor jittering across the edge from machine-gunning.
    if(keyHot && !keyWasHot && (now-lastStrike) > 450){
      lastStrike = now;
      const tp=hammerTip(); if(tp) hammerSparks(tp.x, tp.y, 120, 1.55);
      setTimeout(()=>{ const q=hammerTip();
        if(q && state==="idle" && keyEl && keyEl.matches(":hover")) hammerSparks(q.x, q.y, 80, 1.2); }, 115);
    }
    keyWasHot = keyHot;

    const burnProg = smooth(Math.min(1, fin/0.92));         // drives the paper burn-off

    // logo: opaque true colours as the burn reveals it; steady warm glow, edges catch at the end
    if(fin>0){
      logo.style.mixBlendMode = "normal";
      logo.style.transform = `translate(-50%,-50%) scale(1.06)`;   // hold steady — no expand
      const glow = Math.min(1, 0.45 + 0.55*burnProg + 0.30*edge);
      logo.style.filter =
        `drop-shadow(0 0 ${(26+90*burnProg+30*edge)|0}px rgba(255,184,0,${glow.toFixed(2)})) `
       +`drop-shadow(0 0 ${(46+120*burnProg+40*edge)|0}px rgba(255,77,31,${glow.toFixed(2)}))`;
    }

    drawFrame(t, surge + hover*0.5 + flameHover*0.5);
    drawAmbient(t, heat);                                    // (5) the constant background burn

    // ── heat body: soft breathing flame aura (cool-left, hot-right) ──
    ctx.save(); ctx.globalCompositeOperation="lighter";
    const heatGlow = (0.10 + 0.90*heat) * dim;               // faint low glow when smoldering
    const dxk = 0.4 + 0.6*heat;                              // lobes tighten when cold
    const fmid = lock ? lock.fy+lock.fh*0.52 : cy;
    const by = fmid + flameH*(0.26 - 0.22*heat);             // glow sits low until struck
    const rad = flameH*(0.18 + 0.34*heat)*(0.92+0.16*breath+surge*0.45);
    function aura(dx, col, a){
      ctx.save(); ctx.translate(fcx+dx, by); ctx.scale(0.60, 1.5);
      const g=ctx.createRadialGradient(0,0,0,0,0,rad);
      g.addColorStop(0, rgba(col,a)); g.addColorStop(.55, rgba(col,a*0.30)); g.addColorStop(1, rgba(col,0));
      ctx.fillStyle=g; ctx.beginPath(); ctx.arc(0,0,rad,0,6.283); ctx.fill(); ctx.restore();
    }
    const flick = 0.85 + 0.15*Math.sin(t*7.3) + 0.1*Math.sin(t*3.1);
    aura(-flameW*0.13*dxk, C.cyan,  (0.13+0.08*breath+surge*0.22)*flick*heatGlow);
    aura( flameW*0.13*dxk, C.ember, (0.16+0.09*breath+surge*0.28)*flick*heatGlow);
    aura( 0,               C.gold,  (0.12+0.07*breath+surge*0.32)*flick*heatGlow);
    ctx.restore();

    // ── fire: rising soft particles (the live heat) ──
    let want = (heat < 0.2) ? (Math.random()<0.45 ? 1 : 0) : Math.round(1 + heat*15);
    for(let s=0;s<want;s++) spawnFire(heat);
    ctx.save(); ctx.globalCompositeOperation="lighter";
    for(let i=fire.length-1;i>=0;i--){
      const p=fire[i];
      p.life-=p.decay;
      if(p.life<=0){ fire.splice(i,1); continue; }
      p.vy*=0.992;
      p.x += p.vx + Math.sin(t*p.wobS+p.wob)*p.drift;
      p.y += p.vy;
      const age=1-p.life;                                   // 0 young → 1 old
      const sideCol = mix(C.cyan, C.ember, p.side);
      let col = mix(mix(C.gold, sideCol, 0.45+0.55*age), C.ember, age*0.5);
      if(age<0.16) col = mix([255,255,235], col, age/0.16); // white-hot tip
      const rr = p.r*(0.5+0.9*p.life);
      const a  = Math.pow(p.life,1.5) * (0.12 + 0.16*heat) * dim;
      ctx.globalAlpha = a<0?0:(a>1?1:a);
      const spr = nearestSprite(col);
      ctx.drawImage(spr, p.x-rr, p.y-rr, rr*2, rr*2);
    }
    ctx.globalAlpha = 1;
    ctx.restore();

    // ── embers ──
    ctx.save(); ctx.globalCompositeOperation="lighter";
    for(let i=embers.length-1;i>=0;i--){
      const p=embers[i];
      p.x+=p.vx; p.y+=p.vy; p.vy+=0.006; p.life-=0.012;
      if(p.life<=0){ embers.splice(i,1); continue; }
      ctx.fillStyle=rgba(p.c, p.life*0.9);
      ctx.beginPath(); ctx.arc(p.x,p.y,p.r*p.life,0,Math.PI*2); ctx.fill();
    }
    ctx.restore();
    drawSparks();

    // ── posterior layer, drawn on the canvas IN FRONT of the logo ──
    ctx2.clearRect(0,0,W,H);
    if(wipeAmt>0 && grainEl) grainEl.style.opacity=String(1-wipeAmt);  // no vignette over the sweep
    // In flare mode the veneer must keep drawing through "done" — otherwise the
    // canvas clears the instant we cross and the frame blanks out under a
    // half-faded flash overlay.
    const frozen = burnProg>=1 || state==="held" ||
                   (state==="done" && IGNITE_MODE!=="flare");
    if(!frozen){
      drawVeneer(t, surge, Math.max(glow, flare*1.5), zap, breath, flare);

      // ── the burn: fronts erode the lockup, revealing the P(θ|D) card beneath ──
      if(burnProg>0 && heroBox){
        const N=120, b=heroBox;
        const rayBox=(px,py,c,s)=>{ let tm=Infinity;
          if(c>0) tm=Math.min(tm,(b.x+b.w-px)/c); else if(c<0) tm=Math.min(tm,(b.x-px)/c);
          if(s>0) tm=Math.min(tm,(b.y+b.h-py)/s); else if(s<0) tm=Math.min(tm,(b.y-py)/s);
          return Math.max(0,tm); };
        const trace=(s,R)=>{ ctx2.beginPath();
          for(let i=0;i<=N;i++){ const ang=i/N*6.283, c=Math.cos(ang), si=Math.sin(ang);
            let rr=R*frontRadius(s,ang);
            rr=Math.min(rr, rayBox(s.x,s.y,c,si));
            const x=s.x+c*rr, y=s.y+si*rr;
            i?ctx2.lineTo(x,y):ctx2.moveTo(x,y);} ctx2.closePath(); };
        const Rof=s=>{ const sp=(burnProg-s.start)/(1-s.start); return sp<=0?0:s.r0+smooth(sp)*(s.rMax-s.r0); };

        ctx2.save(); ctx2.globalCompositeOperation="destination-out";
        for(const s of burnFronts){ const R=Rof(s); if(R<=0) continue;
          trace(s,R); ctx2.fill();
          ctx2.lineWidth=18; ctx2.strokeStyle="rgba(0,0,0,0.5)"; trace(s,R); ctx2.stroke();
        }
        ctx2.restore();

        ctx2.save(); ctx2.globalCompositeOperation="lighter";
        for(const s of burnFronts){ const R=Rof(s); if(R<=0) continue;
          const a = s.bright;
          trace(s,R);
          ctx2.lineWidth=16; ctx2.strokeStyle=rgba(C.flame,0.10*a); ctx2.stroke();
          ctx2.lineWidth=10; ctx2.strokeStyle=rgba(C.ember,0.16*a); ctx2.stroke();
          ctx2.lineWidth=6;  ctx2.strokeStyle=rgba(C.ember,0.50*a); ctx2.stroke();
          trace(s,R*0.985);
          ctx2.lineWidth=2.2; ctx2.strokeStyle=rgba(C.gold,0.72*a); ctx2.stroke();
          for(let i=0;i<N;i+=2){ const ang=i/N*6.283, d=frontHeat(s,ang); if(d<0.34) continue;
            const c=Math.cos(ang), si=Math.sin(ang);
            let rr=R*frontRadius(s,ang); rr=Math.min(rr, rayBox(s.x,s.y,c,si));
            const x=s.x+c*rr, y=s.y+si*rr, fl=0.55+0.45*Math.sin(t*16+i+s.bias*3);
            ctx2.fillStyle=rgba(mix(mix(C.ember,C.gold,d),[255,255,235],0.3),(0.4+0.55*d)*a*fl);
            ctx2.beginPath(); ctx2.arc(x,y,2+4*d,0,6.283); ctx2.fill();
          }
        }
        ctx2.restore();

        ctx2.save(); ctx2.globalCompositeOperation="destination-out";
        for(const s of burnFronts){ const R=Rof(s); if(R<=0) continue;
          trace(s, Math.max(1, R-12)); ctx2.fill(); }
        ctx2.restore();

        for(const s of burnFronts){ const sp=(burnProg-s.start)/(1-s.start); if(sp<=0||sp>0.96) continue;
          if(embers.length<EMBER_CAP && Math.random()<0.45){ const ang=Math.random()*6.283, c=Math.cos(ang), si=Math.sin(ang);
            let rr=Rof(s)*frontRadius(s,ang); rr=Math.min(rr, rayBox(s.x,s.y,c,si));
            embers.push({x:s.x+c*rr, y:s.y+si*rr,
              vx:c*0.5+(Math.random()-0.5)*0.5, vy:si*0.5-0.8,
              life:1, r:1.4+Math.random()*2.6, c:mix(C.flame,C.gold,Math.random())}); }
        }
      }
    }

    drawWipe();                     // last thing painted — it covers everything
    requestAnimationFrame(frame);
  }
  resize();                       // first layout — everything above is declared by now
  requestAnimationFrame(frame);
})();
</script>
